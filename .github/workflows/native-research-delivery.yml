name: Native research delivery
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/research_delivery.py --check
      - run: python scripts/test_research_delivery.py

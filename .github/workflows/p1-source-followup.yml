name: P1 source follow-up integrity
on: [push, pull_request]
jobs:
  source-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/p1_source_followup.py
      - run: python scripts/evidence_query.py --check
      - run: python -m unittest discover -s tests -p test_p1_source_followup.py -v
      - run: python scripts/p1_human_request.py
      - run: python -m unittest discover -s tests -p test_p1_human_request.py -v

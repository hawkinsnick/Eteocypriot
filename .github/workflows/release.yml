name: Publish validated release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_check.py
      - run: python scripts/package_release.py
      - name: Publish immutable tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import pathlib,re; assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',pathlib.Path('VERSION').read_text().strip())"
          version=$(cat VERSION)
          project=${GITHUB_REPOSITORY#*/}
          notes="docs/RELEASE_${version//./_}.md"
          if [ ! -f "$notes" ]; then notes='docs/RELEASE_1_0.md'; fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create "v$version" "dist/$project-$version.zip" dist/SHA256SUMS --target "$GITHUB_SHA" --title "$version — attributed source snapshot and research toolkit" --notes-file "$notes"
          fi

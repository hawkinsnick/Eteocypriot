name: Sync AI skill
on:
  push:
    branches: [main]
    paths-ignore:
      - 'ai-skill/generated/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate AI skill state
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python ai-skill/scripts/sync_skill.py
      - name: Commit synchronized skill metadata
        run: |
          if git diff --quiet -- ai-skill/generated/source-state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-skill/generated/source-state.json
          git commit -m "chore(ai-skill): sync to corpus ${GITHUB_SHA::12}"
          git push

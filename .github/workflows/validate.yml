name: Validate corpus snapshot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/release_check.py
      - name: Rebuild and check deterministic generated data
        run: |
          python -m etec build
          python -m etec export --output exports
          git diff --exit-code -- data/records.json data/signs.json exports
